name: Unit Tests

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

permissions:
  contents: read

jobs:
  unit-tests:
    name: "Python ${{ matrix.python-version }} Unit Tests"
    runs-on: ubuntu-22.04
    env:
      TOX_SUITE: unit

    strategy:
      matrix:
        python-version: ["3.7", "3.8", "3.9", "pypy3.9"]

    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

    - name: Install build dependencies
      run: |
        sudo apt-get install -yqq build-essential libsnappy-dev
        sudo apt-get -y install python3-distutils-extra

    - name: "Set up Python ${{ matrix.python-version }}"
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: "${{ matrix.python-version }}"

    - name: Install dependencies
      run: |
        set -xeu
        python -VV
        python -m pip install tox tox-gh-actions

    - name: Tox
      run: |
        python -m tox

  lint:
    name: "Python ${{ matrix.python-version }} Lint"
    runs-on: ubuntu-22.04
    env:
      TOX_SUITE: lint

    strategy:
      matrix:
        python-version: ["3.9"]

    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

    - name: "Set up Python ${{ matrix.python-version }}"
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: "${{ matrix.python-version }}"

    - name: Install dependencies
      run: |
        set -xeu
        python -VV
        python -m pip install tox tox-gh-actions

    - name: Tox
      run: |
        python -m tox

  docs:
    name: "Documentation"
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

    - name: Cache Intersphinx inventories
      # Cache intersphinx inventories to make the build more robust in
      # the face of upstreams going down.
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: docs/_cache
        key: intersphinx-${{ hashFiles('docs/conf.py') }}
        restore-keys: |
          intersphinx-${{ hashFiles('docs/conf.py') }}
          intersphinx-

    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: "3.9"

    - name: Install dependencies
      run: |
        set -xeu
        python -VV
        python -m pip install tox

    - name: Build Documentation
      run: python -m tox -e docs

  packaging:
    name: "Packaging"
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: "3.9"

    - name: Install dependencies
      run: |
        set -xeu
        python -VV
        python -m pip install tox build

    - name: Check Packaging
      run: |
        python -m tox -e twine -- pip install -q build && python -m build
        python -m tox -e twine -- twine check dist/*
